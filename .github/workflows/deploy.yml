name: Deploy Todo Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  APP_NAME: todo-backend

jobs: 
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'demo/pom.xml'
          
      - name: Build Application with Maven 
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}  
   
      - name: Build Docker image
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:latest .
          echo "Successfully built docker image"
          docker images

      - name: Push Docker image to DockerHub
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:latest
          echo "Successfully pushed docker image to DockerHub"