name: Deploy Todo Backend

on:
    workflow_dispatch:
    push:
        branches:
            - main

env:
  APP_NAME: todo-backend
            
            
jobs: 
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: set up java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build Application with Maven 
        run: |
            chmod +x mvnw
            ./mvnw clean package -DskipTests

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}  
   
      - name: Build Docker image
        run: |
          docker build \
          -t ${{ vars.DOCKERHUB_USERNAME }}/${{env.APP_NAME}}:latest \
           .
           echo "Successfully build docker image"
           docker images

      - name: Push Docker image to dockerhub
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/${{env.APP_NAME}}:latest
          echo "Successfully pushed docker image to dockerhub"